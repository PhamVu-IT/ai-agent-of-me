# Tự build app trên GitHub mỗi lần đẩy code hoặc mở PR, để biết sớm main có còn biên dịch được không.
name: Build Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Bản sherpa-onnx.aar dùng để build thử (máy bạn có thể dùng bản khác cùng dòng 1.12.x)
      SHERPA_ONNX_VERSION: "1.12.15"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tải sherpa-onnx.aar vào app/libs
        run: |
          mkdir -p app/libs
          curl -fsSL -o app/libs/sherpa-onnx.aar \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_ONNX_VERSION}/sherpa-onnx-${SHERPA_ONNX_VERSION}.aar"
      - name: Build bản debug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
